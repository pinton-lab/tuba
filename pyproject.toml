[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuba"
version = "0.0.1"
description = "Transcranial Ultrasound Brain Atlas — unified skull-microCT + brain-atlas registration for mouse, macaque, and human."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gianmarco Pinton", email = "gianmarco.pinton@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
    "pynrrd>=1.0",
    "tifffile>=2023.1",
    "scikit-image>=0.21",
    "antspyx>=0.4",
    "matplotlib>=3.7",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
viz = ["nilearn>=0.10", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
# Lightweight, self-contained demo pillar (tuba.mini): fetches the
# ITRUSST benchmark skull STLs + MNI152 template. antspyx (core dep) is
# needed only to build the transforms; consuming cached products is not.
mini = ["trimesh>=4.0", "nilearn>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tuba*"]

[tool.setuptools.package-data]
tuba = ["data/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
