name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Import + manifest smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create venv on Python ${{ matrix.python-version }}
        # A uv-managed venv (not --system): the runner's system Python is
        # PEP-668 externally-managed and not writable without root, and
        # --system ignores the matrix version. uv fetches the requested
        # CPython and owns the venv. Putting .venv/bin on PATH lets the
        # later plain `python`/`pytest` steps resolve to it.
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (lightweight; antspyx skipped on CI)
        run: |
          # antspyx wheels are heavy and not needed for the import/manifest
          # smoke tests; the regression tests skip themselves when legacy
          # data is absent, which it always is on CI.
          uv pip install numpy scipy nibabel pynrrd tifffile scikit-image matplotlib pytest ruff

      - name: Install TUBA (editable, no extras)
        run: uv pip install -e . --no-deps

      - name: Import smoke test
        run: |
          python -c "import tuba; print('tuba', tuba.__version__)"
          python -c "import tuba.core.frame, tuba.core.downsample, tuba.core.align, tuba.core.cavity, tuba.core.surface, tuba.core.slab, tuba.core.placement, tuba.core.qc; print('core OK')"
          python -c "import tuba.atlases.allen_ccfv3, tuba.atlases.mni152; print('atlases OK')"
          python -c "import tuba.species.mouse, tuba.species.human, tuba.species.macaque; print('species OK')"
          python -c "import tuba.io.nrrd, tuba.io.tiff_stack; print('io OK')"

      - name: Data manifest loads
        run: |
          python -c "
          from tuba.data import sources, all_sources, get
          print(f'manifest entries: {len(sources)}')
          for s in all_sources():
              assert s.role and s.description and s.license
          print('manifest schema OK')"

      - name: MNI152 catalogue resolves
        run: |
          python -c "
          from tuba.atlases.mni152 import PARCELLATIONS, available_parcellations
          for p in available_parcellations():
              assert p.name and p.n_labels > 0
          print(f'{len(PARCELLATIONS)} parcellations catalogued')"

      - name: Lint (error-class rules only)
        # Deliberately NOT ruff's full default set: that currently reports
        # ~280 findings (mostly import order and unused imports), so gating
        # on it would just mean a permanently red build. E9/F63/F7 are the
        # "this code is actually broken" subset -- syntax errors, invalid
        # comparisons, unreachable constructs -- and the tree is clean on
        # them today. Widen this as the backlog is cleared; F82
        # (undefined-name) is the obvious next rung.
        run: ruff check . --select E9,F63,F7

      - name: Regression tests
        # No `|| true`: the suite must be able to fail the build. Tests that
        # need staged data or antspyx skip themselves (verified: 39 passed,
        # 3 skipped, 0 failed under exactly this dependency set with an
        # empty HOME), so a real failure here is a real regression.
        run: pytest tests/ -v
