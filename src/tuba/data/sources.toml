notes = "Built from 29 squirrel monkeys at the Vanderbilt University Institute of Imaging Science. RRID:SCR_015542. Ships anatomical (proton-density, T1, T2*), diffusion (FA, MD) and ex-vivo templates plus histologically-defined cortical labels and tractography-defined white-matter labels, all in one ~30 MB VALiDATe29.zip. Exact internal filenames drift across releases 1.0/1.1/1.2, so tuba.atlases.validate29.VALiDATe29 resolves template/labels/LUT by keyword glob (overridable). Distributed CC BY via NITRC's click-through FRS; fetch_validate29.py discovers the newest download.php/<id>/VALiDATe29.zip link ($VALIDATE29_URL overrides). Working template resolution ~0.3 mm (in/ex-vivo channels differ); voxel_mm is nominal."

