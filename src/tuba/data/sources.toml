# an HU-calibrated colony CT (Vanderbilt) to enable quantitative acoustics.

[saimiri.skull]
role = "skull"
description = "Saimiri sciureus dry-skull microCT, USNM 338948, 0.1189 mm iso (UTCT / DigiMorph; oVert mirror on MorphoSource)"
citation = "J. Rossie. Saimiri sciureus (On-line), Digital Morphology, University of Texas High-Resolution X-ray CT Facility (UTCT), 2002, https://digimorph.org/specimens/Saimiri_sciureus/338948/. Collection context: L. E. Copes, L. A. B. Lucas, J. O. Thostenson, H. E. Hoekstra, D. M. Boyer. A collection of non-human primate computed tomography scans housed in MorphoSource. Sci Data 3:160001, 2016."
doi = "https://doi.org/10.1038/sdata.2016.1"
source_url = "https://digimorph.org/specimens/Saimiri_sciureus/338948/"
blob_urls = []
