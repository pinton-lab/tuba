notes = "USNM 338948 (National Museum of Natural History), scanned by UTCT: 540 slices, 0.1189 mm isotropic, 54.0 mm field of reconstruction. Squirrel-monkey calvarium is 1.0-1.5 mm (rat-like) = ~8-13 voxels at this pitch. UNCALIBRATED (arbitrary reconstruction counts, no HU phantom): staged for GEOMETRY ONLY. DigiMorph lists the raw stack as request-only; the same oVert/oUTCT specimens are mirrored on MorphoSource (e.g. media 000039292) behind a free-account per-record approval, same pattern as macaque.skull. fetch_saimiri.py prints the source URLs + drop location and unpacks any archive that lands locally. sha256 omitted until a specific staged archive is pinned."

