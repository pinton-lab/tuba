]
license = "open (Allen Brain Atlas terms)"
auth_required = "none"
fetcher_script = "src/tuba/data/fetch_allen.py"
format = "NRRD (uint32 label volume)"
voxel_um = 25.0
approx_size_gb = 0.03
sha256 = "c620cbcc562183e4dcd40250d440130501781f74b41de35b1c1bdabace290c42"
companion_files = [
    { name = "structure_tree.json", sha256 = "b5f0d024d1df09ee18aef15093f55240f4a70b3924ee9689add612dadff80386", size_mb = 1 },
]
n_specimens = 1
