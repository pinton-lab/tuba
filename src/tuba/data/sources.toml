doi = "https://doi.org/10.1016/j.neuroimage.2011.02.009"
source_url = "https://www.diedrichsenlab.org/imaging/propatlas.htm"
blob_urls = [
    "https://raw.githubusercontent.com/DiedrichsenLab/cerebellar_atlases/1b62fdc0954d34ed768ec36e81ce6a007dbe9e3c/Diedrichsen_2009/atl-Anatom_space-MNI_dseg.nii",
    "https://raw.githubusercontent.com/DiedrichsenLab/cerebellar_atlases/1b62fdc0954d34ed768ec36e81ce6a007dbe9e3c/Diedrichsen_2009/atl-Anatom_space-MNI_probseg.nii",
    "https://raw.githubusercontent.com/DiedrichsenLab/cerebellar_atlases/1b62fdc0954d34ed768ec36e81ce6a007dbe9e3c/Diedrichsen_2009/atl-Anatom.tsv",
    "https://raw.githubusercontent.com/DiedrichsenLab/cerebellar_atlases/1b62fdc0954d34ed768ec36e81ce6a007dbe9e3c/Diedrichsen_2009/atl-Anatom.lut",
]
license = "open (unstated)"
auth_required = "none"
fetcher_script = "src/tuba/data/fetch_cerebellar_atlases.py"
format = "NIfTI"
voxel_mm = 1.0
approx_size_gb = 0.05
# sha256 = the primary dseg (the file PARCELLATIONS registers + warp_atlases
# warps); the probseg/tsv/lut ride along in companion_files. All four hashed
# from the pinned commit 1b62fdc (raw.githubusercontent, 2025-10-26).
sha256 = "434471d89ff329e6e14cdecb66998018fe0dcadbbe47781429148d0017598b72"
companion_files = [
    { name = "atl-Anatom_space-MNI_probseg.nii", sha256 = "bbc3b018e76687506c06de31da28813f24a0e2daaa513e57899d15cb3c51d259", size_mb = 45.0 },
    { name = "atl-Anatom.tsv", sha256 = "dc682c847972bd37badaa979526cf22a25bc79cdf50f4f49c107391c517fe7ad", size_mb = 0.001 },
    { name = "atl-Anatom.lut", sha256 = "8483df5da8897deb5c68a9bdad9d971684de6dcb848f33ce479ecba6b85a4951", size_mb = 0.001 },
]
n_specimens = 23  # deep nuclei from 23 subjects (7T SWI); lobules from a separate 20
notes = "atl-Anatom ships a discrete dseg (most-probable compartment, 34 labels) and a 4-D probseg (per-compartment probability, prob in [0,1], volume v -> label v+1). Deep cerebellar nuclei are labels 29-34 (Left/Right Dentate, Interposed, Fastigial); tuba.atlases.mni152.dentate_mask thresholds the probseg. SUIT-vs-MNI caveat: the repo also ships *_space-SUIT_* and an MNISym variant -- tuba binds the MNI files so the existing MNI->Halle SyN warp applies. The MNI grid is a 1 mm RAS volume cropped to the infratentorial FOV (origin [76,-108,-72], shape 153x103x84). Dentate centroid sanity (probseg, thr 0.5): left ~[-14.6,-60.1,-34.3] mm (0.93 cm^3), right ~[15.6,-59.5,-34.6] mm (1.07 cm^3), ~4-5 mm from the manuscript-cited [+/-12,-57,-34..-36]. sha256 pinned for all four files (dseg above, probseg/tsv/lut in companion_files) against cerebellar_atlases commit 1b62fdc, 2025-10-26. Distributed openly for research (CITATION.cff present, no SPDX LICENSE file)."

