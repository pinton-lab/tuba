# Mouse
# =============================================================================

[mouse.skull]
role = "skull"
description = "Adult mouse dry skull, Skyscan 1272 4K detector, 6.127 um iso"
citation = "M. Maga and collaborators, Sample microCT data from the SCRI Bone and Skeletal Mechanics Lab. University of Washington."
source_url = "https://faculty.washington.edu/maga/SCRI_MicroCT/"
blob_urls = ["https://app.box.com/s/mtvctm7rus8udrav7qkrraq3syatvf5n"]
license = "open (unstated)"
auth_required = "click-through"
fetcher_script = "src/tuba/data/fetch_mouse.py"
format = "TIFF stack (uint16)"
voxel_um = 6.127
approx_size_gb = 35.0
n_specimens = 1
archive_sha256 = "1be081202123b766b92277d38888c8fd52c6e1ddca482bd443e7c5b46275c9e0"
archive_name = "dry_skull_4K_6.125micron_Rec.zip"
notes = "Dry skull, no soft tissue, no jaw, no spine, no in-situ brain. Box.com requires interactive download (no unauthenticated direct fetch)."

[mouse.atlas_template]
role = "atlas_template"
description = "Allen Mouse CCFv3 average template, 25 um isotropic"
citation = "Q. Wang, S.-L. Ding, Y. Li, et al. The Allen Mouse Brain Common Coordinate Framework: A 3D Reference Atlas. Cell 181(4):936-953.e20, 2020."
doi = "https://doi.org/10.1016/j.cell.2020.04.007"
source_url = "http://download.alleninstitute.org/informatics-archive/current-release/mouse_ccf/"
blob_urls = [
    "http://download.alleninstitute.org/informatics-archive/current-release/mouse_ccf/average_template/average_template_25.nrrd",
]
license = "open (Allen Brain Atlas terms)"
auth_required = "none"
fetcher_script = "src/tuba/data/fetch_allen.py"
format = "NRRD"
voxel_um = 25.0
approx_size_gb = 0.05
sha256 = "e4a2b483e842b4c8c1b5452d940ea59e14bc1ebaa38fe6a9c3bacac6db2a8f4b"
n_specimens = 1675  # CCFv3 average is built from ~1,675 mice
notes = "10 um and 50 um variants also available at the same root path; TUBA binds to 25 um as the SyN fixed-grid and the 10 um as the warped-product source."

[mouse.atlas_annotation]
role = "atlas_annotation"
