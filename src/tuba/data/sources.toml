# TUBA data-source manifest
# =========================
#
# Single point of truth for the external datasets TUBA depends on.
# Every external file referenced by `tuba.species.*` or `tuba.atlases.*`
# must have a row in this manifest. The schema is uniform across
# datasets so downstream tooling can iterate.
#
# NOTE: this manifest only DESCRIBES the data (where it comes from + how to
# fetch it). The data files themselves are NOT committed to the repo -- they
# are multi-GB and often licensed, so each user stages them locally with the
# fetch_*.py scripts (they land under ~/.cache/tuba/<species>/ and
# ~/nilearn_data/). See the top-level README "Data" section.
#
# Schema (per entry)
# ------------------
#   key            : dotted path, [<species>.<role>] or [atlas.<name>]
#   role           : "skull" | "atlas_template" | "atlas_annotation" |
#                    "atlas_parcellation" | "ancillary"
#   description    : one-line human summary
#   citation       : free-form citation string (paper + DOI when known)
#   doi            : DOI URL (omit if not available)
#   source_url     : landing page (preferred over raw blob URL when both
#                    exist, so users see the host's licensing context)
#   blob_urls      : list of direct-fetch URLs (omit if interactive-only)
#   license        : SPDX-style tag if known; "open (FAIR)" /
#                    "open (unstated)" / "CC BY-NC" / "interactive-only"
#                    otherwise. "unknown" iff the host surfaces nothing.
#   auth_required  : "none" | "click-through" | "login+approval"
#   fetcher_script : repo-relative path to a fetcher (helper script or
#                    one of the legacy `templates/fetch_*.py` files);
#                    OMIT the key entirely when no fetcher exists.
#                    TOML has no null literal -- the loader fills in
#                    None via dataclass defaults for missing keys.
#   format         : "TIFF stack" | "NRRD" | "NIfTI" | "tarball" | ...
#   voxel_um       : isotropic voxel size in micrometres
#                    (use voxel_mm for >= 1 mm scans)
#   approx_size_gb : decompressed footprint estimate
#   sha256         : omit until the user pins a checksum (string).
#   n_specimens    : 1 unless the dataset is multi-subject
#   notes          : free-form caveats / gotchas
#
# When adding a new species, append a new top-level table.
# Conventions:
#   * Use ISO-style integers for sizes; never floats with units inline.
#   * Omit a key entirely for "unknown" (TOML has no null literal).
#     Consumers see Source.<field> == None via the loader's defaults.
#   * Don't dedup citations across entries; each entry stands alone.

